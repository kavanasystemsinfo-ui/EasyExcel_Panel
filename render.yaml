# Configuracion de Render para EasyExcel Panel.
#
# POR QUE RENDER Y NO VERCEL
# Vercel (funciones serverless) monta el filesystem en /tmp, que NO sobrevive
# entre invocaciones: el Excel subido se perdia y las hojas dejaban de
# cargarse ("a veces no carga"). En Render el proceso es unico y vive entre
# peticiones, asi que /tmp aguanta el tiempo que dura la carga del Excel.
#
# ARQUITECTURA
# - easyexcel-backend: API FastAPI (este repo). Uploads temporales en /tmp.
# - easyexcel-frontend: sitio estatico Vite, servido por Render con proxy
#   /api hacia el backend. Asi el navegador ve un unico origen (sin CORS) y
#   no hace falta VITE_API_URL.
#
# Documentacion: https://render.com/docs/blueprint-spec

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: easyexcel-backend
    runtime: python
    # La app se importa como 'app.main:app' (NO 'backend.app.main:app'):
    # main.py usa imports absolutos del tipo 'from app.ai import assistant',
    # que solo resuelven si backend/ esta en el path de trabajo.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Health check: endpoint /health del modulo health.
    healthCheckPath: /health
    autoDeploy: true
    # Plan gratuito: sin disco persistente (los discos exigen plan de pago).
    # No hace falta: el navegador descarga todas las filas justo despues de
    # subir el Excel y los archivos solo viven unas horas (TTL), asi que el
    # disco efimero del plan gratuito basta.
    plan: free
    envVars:
      - key: EASYEXCEL_OPENROUTER_API_KEY
        sync: false
      - key: EASYEXCEL_NVIDIA_API_KEY
        sync: false
      # Directorio de uploads: disco efimero (se vacia al reiniciar).
      - key: EASYEXCEL_UPLOAD_DIR
        value: /tmp/easyexcel-uploads
      # CORS: allow_origins vacio porque el proxy serve todo desde el mismo
      # origen. Se deja el dominio propio por si el frontend se sirve aparte.
      - key: EASYEXCEL_CORS_ORIGINS
        value: '["https://easyexcel.kavanasystems.com","http://localhost:5173","http://localhost:8000"]'

  # ── Frontend estatico ──────────────────────────────────────────────────
  - type: web
    name: easyexcel-frontend
    runtime: static
    rootDir: frontend
    # npm ci: instalacion reproducible desde el package-lock (mismo codigo en CI y en deploy)
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Dominio propio del panel. Con este proxy, el navegador llama a
    # /api/... en el mismo origen y el proxy lo reenvia al backend.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://easyexcel-backend.onrender.com/api/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://stats.kavanasystems.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://stats.kavanasystems.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"


services:
  - type: web
    name: easyexcel-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EASYEXCEL_OPENROUTER_API_KEY
        value: ""
      - key: EASYEXCEL_NVIDIA_API_KEY
        value: ""
